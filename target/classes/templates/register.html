<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaCourse | Plateforme de Cours en Ligne</title>
    <meta name="description" content="MaCourse - Plateforme educative moderne avec des cours en ligne de qualite.">
    <link rel="stylesheet" th:href="@{/style.css}">
    <script th:src="@{/script.js}" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body data-page="register">
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
    </nav>
  </header>

  <main class="auth-main">
    <div class="container auth-container">
      <div class="auth-card">
        <h1 class="auth-title">Creer un compte</h1>
        <p class="auth-subtitle">Rejoignez des milliers d'apprenants sur MaCourse.</p>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" novalidate>
          <div class="form-field auth-field">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" placeholder="jeandupont" required autocomplete="username">
          </div>

          <div class="form-field auth-field">
            <label for="registerEmail">Adresse e-mail</label>
            <input type="email" id="registerEmail" name="email" placeholder="votre@email.com" required autocomplete="email">
          </div>

          <div class="form-field auth-field">
            <label for="registerPassword">Mot de passe</label>
            <input type="password" id="registerPassword" name="password" placeholder="Min. 6 caracteres" required autocomplete="new-password">
            <small class="text-muted">Le mot de passe doit avoir cel putin 6 caractere.</small>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="termsCheck" required>
            <label class="form-check-label" for="termsCheck">
              J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialite</a>.
            </label>
          </div>

          <button type="submit" class="button button-primary auth-submit" style="width:100%;">Creer mon compte</button>
        </form>

        <div class="auth-links text-center">
          <p class="mt-3">Vous avez deja un compte ? <a th:href="@{/login}">Se connecter</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col">
          <h3>MaCourse</h3>
          <p>Plateforme d'apprentissage en ligne moderne si accesibila.</p>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
