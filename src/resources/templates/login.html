<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | MaCourse</title>
  <link rel="stylesheet" href="/style.css" th:href="@{/style.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="/script.js" th:src="@{/script.js}" defer></script>
</head>
<body data-page="login">
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
          <span class="brand-mark">M</span>
          <strong>MaCourse</strong>
          <small>Plateforme de Cours en Ligne</small>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
            <li class="nav-item"><a class="nav-link" href="courses.html">Cours</a></li>
            <li class="nav-item"><a class="nav-link" href="categories.html">Catégories</a></li>
            <li class="nav-item"><a class="nav-link" href="instructors.html">Instructeurs</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">À propos</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
          </ul>
          <div class="d-flex">
            <a class="btn btn-outline-primary me-2" th:href="@{/login}">Connexion</a>
            <a class="btn btn-primary" href="dashboard.html">Dashboard</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="auth-main">
    <div class="container auth-container">
      <div class="auth-card">
        <h1 class="auth-title">Connexion</h1>
        <p class="auth-subtitle">Accedez a vos cours en quelques secondes.</p>
        <form th:action="@{/login}" method="post" id="loginForm" novalidate>
          <div class="form-field auth-field">
            <label for="loginEmail">Adresse e-mail</label>
            <input type="email" id="loginEmail" name="email" required>
          </div>
          <div class="form-field auth-field">
            <label for="loginPassword">Mot de passe</label>
            <input type="password" id="loginPassword" name="password" required>
          </div>
          <button type="submit" class="button button-primary auth-submit">Se Connecter</button>
          <div id="loginFormStatus" class="form-status" aria-live="polite"></div>
        </form>
        <div class="auth-links">
          <p><a href="#">Mot de passe oublie ?</a></p>
          <p>Pas de compte ? <a th:href="@{/register}">S'inscrire</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col">
          <h3>MaCourse</h3>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
