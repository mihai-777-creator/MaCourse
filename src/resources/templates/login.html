<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaCourse | Plateforme de Cours en Ligne</title>
    <meta name="description" content="MaCourse - Plateforme educative moderne avec des cours en ligne de qualite.">
    <link rel="stylesheet" th:href="@{/style.css}">
    <script th:src="@{/script.js}" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body data-page="login">
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
    </nav>
  </header>

  <main class="auth-main">
    <div class="container auth-container">
      <div class="auth-card">
        <h1 class="auth-title">Connexion</h1>
        <p class="auth-subtitle">Accedez a vos cours en quelques secondes.</p>

        <div th:if="${formError}" class="alert alert-danger" role="alert" th:text="${formError}"></div>
        <div th:if="${formInfo}" class="alert alert-info" role="alert" th:text="${formInfo}"></div>
        <div th:if="${formSuccess}" class="alert alert-success" role="alert" th:text="${formSuccess}"></div>

        <form th:action="@{/login}" method="post" id="loginForm" novalidate>
          <div class="form-field auth-field">
            <label for="loginEmail">Adresse e-mail</label>
            <input type="email" id="loginEmail" name="email" required autocomplete="email" autofocus>
          </div>
          <div class="form-field auth-field">
            <label for="loginPassword">Mot de passe</label>
            <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="button button-primary auth-submit">Se Connecter</button>
          <div id="loginFormStatus" class="form-status" aria-live="polite"></div>
        </form>

        <div class="auth-links">
          <p><a href="#">Mot de passe oublie ?</a></p>
          <p>Pas de compte ? <a th:href="@{/register}">S'inscrire</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col">
          <h3>MaCourse</h3>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
