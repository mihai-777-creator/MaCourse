# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/macourse_db
spring.datasource.username=root
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Application Configuration
spring.application.name=MaCourse
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.prefix=file:src/resources/templates/
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static Resources for the current workspace layout
spring.web.resources.static-locations=file:./,file:src/resources/static/

# Logging Configuration
logging.level.root=INFO
logging.level.com.application.course=DEBUG
logging.level.org.springframework.security=DEBUG

# Session Configuration
server.servlet.session.timeout=30m
